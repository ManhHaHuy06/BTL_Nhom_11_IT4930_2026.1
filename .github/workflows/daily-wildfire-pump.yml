name: Daily US wildfire Kaggle to Object Storage

on:
  schedule:
    - cron: '0 13 * * *' # 20:00 Asia/Ho_Chi_Minh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-wildfire-pump
  cancel-in-progress: false

jobs:
  pump:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: crawl-data/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r crawl-data/requirements.txt
      - name: Test CSV and retry behavior
        working-directory: crawl-data
        run: python -m unittest discover -s tests -v
      - name: Copy next CSV batch
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_ENDPOINT: ${{ vars.KAGGLE_ENDPOINT || secrets.KAGGLE_ENDPOINT }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT || secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          S3_REGION: ${{ vars.S3_REGION || 'ap-singapore-1' }}
          DATA_BUCKET: ${{ vars.DATA_BUCKET || 'raw-zone' }}
          STATE_BUCKET: ${{ vars.STATE_BUCKET || 'system-state' }}
          CHUNK_SIZE: ${{ vars.CHUNK_SIZE || '1000000' }}
        run: python crawl-data/daily_pump.py
